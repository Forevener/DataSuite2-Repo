name: Build and deploy wasm R package repository
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/main.yml

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/r-wasm/webr:main
    steps:
      # Fortran packages (quadprog, rootSolve, muhaz, deSolve): LLVM flang chokes
      # on host-CPU flags R passes it. Strip the incompatible ones. Harmless for
      # C/C++/pure-R packages.
      - name: Create flang wrapper to filter incompatible flags
        run: |
          cp /opt/flang/host/bin/flang /opt/flang/host/bin/flang-orig
          printf '#!/bin/bash\nargs=()\nfor arg in "$@"; do\n  case "$arg" in\n    -fvisibility=*|-msse*|-mfpmath=*) ;;\n    *) args+=("$arg") ;;\n  esac\ndone\nexec /opt/flang/host/bin/flang-orig "${args[@]}"\n' > /opt/flang/host/bin/flang
          chmod +x /opt/flang/host/bin/flang

      - name: Build packages and any hard deps missing upstream
        shell: Rscript {0}
        run: |
          # DescTools -> Exact -> rootSolve, but only rootSolve's pure-R
          # uniroot.all is used. Its Fortran LSODA solvers use a COMMON block the
          # wasm backend can't link (webr#425), and useDynLib drags the unlinkable
          # .so in at load time. Strip the compiled code so the namespace loads.
          rootSolve_shim <- function(
              url = "https://cran.r-project.org/src/contrib/rootSolve_1.8.2.4.tar.gz") {
            tb  <- tempfile(fileext = ".tar.gz"); download.file(url, tb, quiet = TRUE)
            dir <- tempfile(); dir.create(dir); untar(tb, exdir = dir)
            pkg <- list.dirs(dir, recursive = FALSE)[1]
            unlink(file.path(pkg, "src"), recursive = TRUE)              # no compiled code
            ns  <- file.path(pkg, "NAMESPACE")
            writeLines(grep("useDynLib", readLines(ns), value = TRUE, invert = TRUE), ns)
            d   <- read.dcf(file.path(pkg, "DESCRIPTION"))
            if ("NeedsCompilation" %in% colnames(d)) d[, "NeedsCompilation"] <- "no"
            write.dcf(d, file.path(pkg, "DESCRIPTION"))
            paste0("local::", pkg)                                       # build from patched source
          }
          
          # brunnermunzel implements its Brunner-Munzel test (including the
          # permutation variant) in Fortran. webR's LLVM flang-rt aborts on the
          # package's runtime array constructors -- e.g. `xy = (/x, y/)` -- with
          # RUNTIME_CHECK(to.rank() == 1) in array-constructor.cpp, so even the
          # asymptotic test (perm = FALSE) crashes. Rewrite every runtime array
          # constructor, the vector-subscript scatter in rank(), and the
          # whole-array assignments into equivalent explicit DO loops
          # (numerically identical). Compile-time `parameter` constructors and
          # contiguous section arguments are left untouched.
          brunnermunzel_shim <- function(
              url = "https://cran.r-project.org/src/contrib/brunnermunzel_2.0.tar.gz") {
            tb  <- tempfile(fileext = ".tar.gz"); download.file(url, tb, quiet = TRUE)
            dir <- tempfile(); dir.create(dir); untar(tb, exdir = dir)
            pkg <- list.dirs(dir, recursive = FALSE)[1]

            E <- function(pattern, ...) list(pattern = pattern, repl = c(...))

            # Replace each line matching a Perl regex (anchored on the statement,
            # tolerant of indentation and trailing comments) with replacement
            # lines. Errors loudly if a pattern is gone, so an upstream source
            # change can't silently reintroduce an array constructor.
            patch <- function(file, edits) {
              path  <- file.path(pkg, "src", file)
              lines <- readLines(path)
              for (e in edits) {
                idx <- grep(e$pattern, lines, perl = TRUE)
                if (length(idx) == 0L)
                  stop(sprintf("brunnermunzel patch: %s: missing pattern: %s",
                               file, e$pattern))
                for (i in rev(idx)) {
                  before <- if (i > 1L) lines[seq_len(i - 1L)] else character(0)
                  after  <- if (i < length(lines)) lines[(i + 1L):length(lines)] else character(0)
                  lines  <- c(before, e$repl, after)
                }
              }
              writeLines(lines, path)
            }

            patch("rank.f", list(
              E("^\\s*integer i,j\\s*$",
                "      integer i,j,k"),
              E("^\\s*rk\\(idx\\(i:j\\)\\)\\s*=",
                "         do k = i, j",
                "            rk(idx(k)) = (i + j) * 0.5",
                "         enddo")
            ))

            patch("bm_test.f", list(
              E("^\\s*double precision se\\s*$",
                "      double precision se",
                "      integer i"),
              E("^\\s*xy\\s*=\\s*\\(/x, y/\\)",
                "      do i = 1, nx",
                "         xy(i) = x(i)",
                "      enddo",
                "      do i = 1, ny",
                "         xy(nx+i) = y(i)",
                "      enddo"),
              E("^\\s*ci\\(1:2\\)\\s*=\\s*pst",
                "         ci(1) = pst",
                "         ci(2) = pst"),
              E("^\\s*dx\\s*=\\s*\\(rkxy\\(1:nx\\)",
                "      do i = 1, nx",
                "         dx(i) = (rkxy(i) - rkx(i) - mx + (nx + 1) * 0.5)**2",
                "      enddo"),
              E("^\\s*dy\\s*=\\s*\\(rkxy\\(nx\\+1:nx\\+ny\\)",
                "      do i = 1, ny",
                "         dy(i) = (rkxy(nx+i) - rky(i) - my + (ny + 1) * 0.5)**2",
                "      enddo"),
              E("^\\s*lowertail\\s*=\\s*\\(/",
                "      lowertail(1) = 0",
                "      lowertail(2) = 1",
                "      lowertail(3) = 0"),
              E("^\\s*multi\\s*=\\s*\\(/",
                "      multi(1) = 2.0",
                "      multi(2) = 1.0",
                "      multi(3) = 1.0"),
              E("^\\s*ci\\s*=\\s*pst\\s*\\+\\s*Rf_qt",
                "      ci(1) = pst - Rf_qt(alpha * 0.5, abs(df), 0) * se",
                "      ci(2) = pst + Rf_qt(alpha * 0.5, abs(df), 0) * se")
            ))

            patch("calc_statistics.f", list(
              E("^\\s*dx\\s*=\\s*\\(rkxy\\(1:nx\\)",
                "      do i = 1, nx",
                "         dx(i) = (rkxy(i) - rkx(i) - mx + const(1))**2",
                "      enddo"),
              E("^\\s*dy\\s*=\\s*\\(rkxy\\(nx\\+1:nx\\+ny\\)",
                "      do i = 1, ny",
                "         dy(i) = (rkxy(nx+i) - rky(i) - my + const(2))**2",
                "      enddo")
            ))

            patch("divide_groups.f", list(
              E("^\\s*integer i,ix,iy\\s*$",
                "      integer i,ix,iy,k"),
              E("^\\s*tmp\\(1:\\(nx\\+1\\)\\)\\s*=",
                "      do k = 1, nx",
                "         tmp(k) = idx(k)",
                "      enddo",
                "      tmp(nx+1) = -1"),
              E("^\\s*xy\\(1:nx\\)\\s*=\\s*x\\(1:nx\\)",
                "      do k = 1, nx",
                "         xy(k) = x(k)",
                "      enddo"),
              E("^\\s*xy\\(\\(nx\\+1\\):\\(nx\\+ny\\)\\)\\s*=",
                "      do k = 1, ny",
                "         xy(nx+k) = y(k)",
                "      enddo")
            ))

            patch("combination.f", list(
              E("^\\s*integer i,bef\\(1:r\\),numx,key\\(1:r\\)\\s*$",
                "      integer i,bef(1:r),numx,key(1:r),k"),
              E("^\\s*bef\\(1:r\\)\\s*=",
                "      do k = 1, r",
                "         bef(k) = arr(k) - ini(k)",
                "      enddo"),
              E("^\\s*arr\\(1:r\\)\\s*=\\s*0\\s*$",
                "      do k = 1, r",
                "         arr(k) = 0",
                "      enddo"),
              E("^\\s*key\\(1:r\\)\\s*=\\s*0",
                "      do k = 1, r",
                "         key(k) = 0",
                "      enddo"),
              E("^\\s*arr\\(1:r\\)\\s*=\\s*arr\\(1:r\\)",
                "      do k = 1, r",
                "         arr(k) = arr(k) + ini(k)",
                "      enddo")
            ))

            patch("bm_permutation_stat.f", list(
              E("^\\s*integer::nx,ny,i,j\\s*$",
                "      integer::nx,ny,i,j,k"),
              E("^\\s*idx\\(1:r\\)\\s*=\\s*ini\\(1:r\\)",
                "      do k = 1, r",
                "         idx(k) = ini(k)",
                "      enddo")
            ))

            patch("bm_permutation_test.f", list(
              E("^\\s*integer::i,count\\s*$",
                "      integer::i,count,k"),
              E("^\\s*dat2\\(1:n\\)\\s*=\\s*dat\\(1:n\\)",
                "      do k = 1, n",
                "         dat2(k) = dat(k)",
                "      enddo"),
              E("^\\s*statistics\\(1:n_nCr\\)\\s*=\\s*abs",
                "         do k = 1, n_nCr",
                "            statistics(k) = abs(statistics(k))",
                "         enddo"),
              E("^\\s*statistics\\(1:n_nCr\\)\\s*=\\s*-statistics",
                "         do k = 1, n_nCr",
                "            statistics(k) = -statistics(k)",
                "         enddo")
            ))

            paste0("local::", pkg)
          }

          library(rwasm)
          repo <- "/github/workspace/repo"

          pkgs <- c(
            "quadprog",
            "qs2",
            rootSolve_shim(),
            brunnermunzel_shim(),
            "nanonext",
            "muhaz",
            "deSolve",
            # CSDP SDP solver for psych::fa(fm = "minrank"); on CRAN but absent
            # from every wasm farm (repo.r-wasm.org, cran.r-universe.dev).
            "Rcsdp",
            "url::https://cran.r-project.org/src/contrib/Archive/biclust/biclust_2.0.3.1.tar.gz",
            "url::https://cran.r-project.org/src/contrib/Archive/rtf/rtf_0.4-14.1.tar.gz"
          )

          # ---- What's already provided, and what's a hard dependency? ----------
          ver     <- paste(R.version$major, sub("\\..*", "", R.version$minor), sep = ".")
          contrib <- sprintf("https://repo.r-wasm.org/bin/emscripten/contrib/%s", ver)
          upstream <- tryCatch(
            rownames(available.packages(contriburl = contrib)),
            error = function(e) {
              message("Could not read official webR index: ", conditionMessage(e)); character(0)
            }
          )
          # base + recommended ship inside webR, so they never need building.
          bundled <- rownames(installed.packages(priority = c("base", "recommended")))
          # CRAN source metadata, used to resolve dependency closures.
          cran <- available.packages(repos = "https://cloud.r-project.org")
          hard <- c("Depends", "Imports", "LinkingTo")

          is_url     <- function(ref) startsWith(ref, "url::")
          is_local   <- function(ref) startsWith(ref, "local::")
          is_special <- function(ref) is_url(ref) || is_local(ref)   # always build; not a CRAN name

          pkg_name <- function(ref) {
            if (is_local(ref)) {
              basename(sub("^local::", "", ref))
            } else if (is_url(ref)) {
              sub("^.*/([A-Za-z0-9.]+)_[0-9].*$", "\\1", ref)
            } else {
              ref
            }
          }

          # Hard deps (Depends/Imports/LinkingTo) from a parsed DESCRIPTION matrix.
          desc_hard_deps <- function(dcf) {
            flds <- intersect(colnames(dcf), hard)
            if (!length(flds)) return(character(0))
            nm <- trimws(gsub("\\(.*?\\)", "",
                              strsplit(paste(dcf[1, flds], collapse = ","), "[,\n]")[[1]]))
            setdiff(nm[nzchar(nm)], "R")
          }

          # DESCRIPTION for a url:: ref (download tarball) or local:: ref (read from disk).
          ref_dcf <- function(ref) {
            if (is_local(ref)) {
              read.dcf(file.path(sub("^local::", "", ref), "DESCRIPTION"))
            } else {
              tmp <- tempfile(fileext = ".tar.gz")
              download.file(sub("^url::", "", ref), tmp, quiet = TRUE)
              inside <- untar(tmp, list = TRUE)
              dpath  <- grep("(^|/)DESCRIPTION$", inside, value = TRUE)[1]
              untar(tmp, files = dpath, exdir = dirname(tmp))
              read.dcf(file.path(dirname(tmp), dpath))
            }
          }

          # ---- Recursive hard-dependency closure of everything requested -------
          req_names <- vapply(pkgs, pkg_name, character(1))
          seed <- unlist(lapply(pkgs, function(p) {
            if (is_special(p)) desc_hard_deps(ref_dcf(p)) else p
          }), use.names = FALSE)
          seed <- unique(seed[seed %in% rownames(cran)])
          closure <- unique(c(seed, unlist(
            tools::package_dependencies(seed, db = cran, which = hard, recursive = TRUE),
            use.names = FALSE)))

          missing_deps <- setdiff(closure, c(upstream, bundled, req_names))
          if (length(missing_deps))
            cat(sprintf("Hard deps missing upstream, building too: %s\n",
                        paste(missing_deps, collapse = ", ")))

          build_set <- c(pkgs, missing_deps)

          ok <- skipped <- failed <- character(0)
          for (p in build_set) {
            name <- pkg_name(p)
            if (!is_special(p) && name %in% upstream) {
              cat(sprintf("\n===== %s available upstream - skipping =====\n", name))
              skipped <- c(skipped, name); next
            }
            cat(sprintf("\n========== Building %s ==========\n", name))
            success <- tryCatch({
              add_pkg(p, repo_dir = repo, dependencies = FALSE)
              TRUE
            }, error = function(e) {
              cat(sprintf("!! BUILD FAILED for %s: %s\n", name, conditionMessage(e)))
              FALSE
            })
            if (isTRUE(success)) ok <- c(ok, name) else failed <- c(failed, name)
          }

          tryCatch(
            build(repo),
            error = function(e) {
              bin <- list.files(file.path(repo, "bin"), recursive = TRUE, pattern = "\\.tgz$")
              if (length(bin) > 0)
                message("Post-build error ignored (binaries present): ", conditionMessage(e))
              else stop(e)
            }
          )

          built <- list.files(file.path(repo, "bin"), recursive = TRUE, pattern = "\\.tgz$")
          cat("\n================ SUMMARY ================\n")
          cat(sprintf("Built (%d): %s\n", length(ok), paste(ok, collapse = ", ")))
          cat(sprintf("Skipped, available upstream (%d): %s\n",
                      length(skipped), paste(skipped, collapse = ", ")))
          cat(sprintf("Total .tgz in repo: %d\n", length(built)))
          if (length(failed)) {
            cat("\n!!!!!!!!!!!!! FAILED PACKAGES !!!!!!!!!!!!!\n")
            cat(sprintf("Failed (%d):\n", length(failed)))
            cat(paste0("  - ", failed, collapse = "\n"), "\n")
          }
          if (length(built) == 0) stop("No packages built - nothing to deploy.")

      - uses: actions/upload-pages-artifact@v3
        with:
          path: /github/workspace/repo

  deploy:
    needs: build
    permissions: { pages: write, id-token: write }
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
