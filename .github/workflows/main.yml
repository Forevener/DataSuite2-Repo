name: Build and deploy wasm R package repository
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/main.yml

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    # Pinned to the webR the app runs (0.6.0): binaries must match the runtime's
    # ABI, and the floating `main` tag swaps toolchains under us -- its Nov 2026
    # republish broke the Fortran links of deSolve and splancs (wasm-ld:
    # "section symbols must have local binding" / "malformed uleb128" while
    # parsing an object). Bump together with the app.
    container: ghcr.io/r-wasm/webr:v0.6.0
    steps:
      # Fortran packages (quadprog, rootSolve, muhaz, deSolve, mclust, splancs, earth): LLVM flang
      # chokes on host-CPU flags R passes it. Strip the incompatible ones. Harmless for
      # C/C++/pure-R packages.
      - name: Create flang wrapper to filter incompatible flags
        run: |
          cp /opt/flang/host/bin/flang /opt/flang/host/bin/flang-orig
          printf '#!/bin/bash\nargs=()\nfor arg in "$@"; do\n  case "$arg" in\n    -fvisibility=*|-msse*|-mfpmath=*) ;;\n    *) args+=("$arg") ;;\n  esac\ndone\nexec /opt/flang/host/bin/flang-orig "${args[@]}"\n' > /opt/flang/host/bin/flang
          chmod +x /opt/flang/host/bin/flang

      # The v0.6.0 image lists rig's apt repository, now signed with a key the
      # image doesn't have (NO_PUBKEY 6C439202CCDB438D). pak runs apt-get update
      # for the system requirements of the host-side deps rwasm installs, so
      # every package with deps failed. The build never uses rig: drop the source,
      # then check apt is clean.
      - name: Drop the rig apt source
        shell: bash
        run: |
          for f in /etc/apt/sources.list.d/*; do
            if [ -f "$f" ] && grep -q 'rig\.r-pkg\.org' "$f"; then
              echo "Removing $f"; rm -f "$f"
            fi
          done
          if [ -f /etc/apt/sources.list ]; then
            sed -i '/rig\.r-pkg\.org/d' /etc/apt/sources.list
          fi
          apt-get update

      # The v0.6.0 image ships pkgdepends 0.9.1, whose resolver fails every
      # add_pkg() with "`nrow(out)` must equal `1`" (r-lib/pkgdepends#462).
      # webR's own image pins this tag, but only after v0.6.0 was cut. Installed
      # from the tag's tarball so pak's resolver never runs. Drop this step once
      # the pinned image carries a fixed pkgdepends.
      - name: Pin pkgdepends to v0.9.0-patched
        shell: Rscript {0}
        run: |
          install.packages(
            "https://github.com/r-lib/pkgdepends/archive/refs/tags/v0.9.0-patched.tar.gz",
            repos = NULL, type = "source", lib = .Library)
          if (packageVersion("pkgdepends", lib.loc = .Library) != "0.9.0")
            stop("pkgdepends pin did not take: ", packageVersion("pkgdepends"))

      - name: Build packages and any hard deps missing upstream
        shell: Rscript {0}
        env:
          # This workflow's own Pages site, the one the deploy job replaces
          # (repo.datasuite.site copies from it in a separate step).
          LIVE_REPO: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: |
          # DescTools -> Exact -> rootSolve. Its LSODES solver shares two ODEPACK
          # COMMON blocks (webr#425) - the same DLS001 and DLSS01 as deSolve, so
          # the same BLOCK DATA fix below; the steady-state solvers keep working,
          # where the earlier shim stripped the compiled code and left only the
          # pure-R uniroot.all.
          rootSolve_shim <- function(
              url = "https://cran.r-project.org/src/contrib/rootSolve_1.8.2.4.tar.gz") {
            common_block_shim("rootSolve", url, "lsodes.f", c("DLS001", "DLSS01"), c(
              "      BLOCK DATA DSBD001",
              "      DOUBLE PRECISION RLS(218)",
              "      INTEGER ILS(37)",
              "      COMMON /DLS001/ RLS, ILS",
              "      DATA RLS /218*0.0D0/",
              "      END",
              "      BLOCK DATA DSBDS01",
              "      DOUBLE PRECISION RLSS(6)",
              "      INTEGER ILSS(34)",
              "      COMMON /DLSS01/ RLSS, ILSS",
              "      DATA RLSS /6*0.0D0/",
              "      END"
            ))
          }

          # Uninitialised named COMMON blocks (webr#425). The LLVM wasm backend has
          # no common symbols: flang emits an uninitialised block as an undefined
          # GOT.mem import that nothing defines, so the .so builds and installs,
          # then dyn.load() fails ("bad export type for 'dls001_': undefined", or
          # a bare TypeError on newer Emscripten). An *initialised* block is a
          # real global -- R's own stats.so resolves its five ppr.f blocks that
          # way, all DATA-initialised in BLOCK DATA. So: append a BLOCK DATA that
          # declares each block and DATA-initialises it. Zero is what BSS gave the
          # code anyway; no routine is touched. Each unit declares the block in
          # the compact layout ODEPACK's own save/restore routines use (one
          # double array, one integer array, sizes read off the verbatim member
          # lists), or member-by-member where the block is small.
          common_block_shim <- function(name, url, file, blocks, block_data) {
            tb  <- tempfile(fileext = ".tar.gz"); download.file(url, tb, quiet = TRUE)
            dir <- tempfile(); dir.create(dir); untar(tb, exdir = dir)
            pkg <- list.dirs(dir, recursive = FALSE)[1]

            # Fail loudly if upstream renamed a block or started initialising one
            # itself -- a second initialisation of the same block is a compile
            # error, a missing one is the load failure coming back.
            src <- unlist(lapply(list.files(file.path(pkg, "src"), pattern = "\\.[fF](90|95)?$",
                                            full.names = TRUE), readLines))
            code <- src[!grepl("^[cC*!]", src)]
            for (b in blocks)
              if (!any(grepl(sprintf("(?i)common\\s*/\\s*%s\\s*/", b), code, perl = TRUE)))
                stop(sprintf("%s patch: COMMON /%s/ no longer declared", name, b))
            if (any(grepl("(?i)^\\s+block\\s*data", code, perl = TRUE)))
              stop(sprintf("%s patch: upstream added a BLOCK DATA unit - check it does not cover %s",
                           name, paste(blocks, collapse = ", ")))

            path <- file.path(pkg, "src", file)
            writeLines(c(readLines(path), "", block_data), path)
            paste0("local::", pkg)
          }

          # mclust: hcvvv() and its helper vvvtij() share /VVVMCL/ (three doubles).
          mclust_shim <- function(
              url = "https://cran.r-project.org/src/contrib/mclust_6.1.3.tar.gz") {
            common_block_shim("mclust", url, "mclust.f", "VVVMCL", c(
              "      block data dsvvvmcl",
              "      double precision   BETA0, ALPHA0, ABLOG",
              "      common /VVVMCL/    BETA0, ALPHA0, ABLOG",
              "      data BETA0, ALPHA0, ABLOG / 0.0d0, 0.0d0, 0.0d0 /",
              "      end"
            ))
          }

          # muhaz: glmin() and its callers share /hazpil/ (hpilot(1000), double).
          muhaz_shim <- function(
              url = "https://cran.r-project.org/src/contrib/muhaz_1.2.6.5.tar.gz") {
            common_block_shim("muhaz", url, "muhaz.f", "HAZPIL", c(
              "      BLOCK DATA DSHAZPIL",
              "      DOUBLE PRECISION hpilot(1000)",
              "      COMMON /hazpil/ hpilot",
              "      DATA hpilot /1000*0.0D0/",
              "      END"
            ))
          }

          # earth (MARS, needed by pre) declares four Fortran subroutines in
          # earth.c as returning int. Native linkers ignore the return type;
          # wasm-ld refuses daxpy_ against webR's libRblas ("function
          # signature mismatch ... -> i32 in earth.o, -> void in libRblas.so"),
          # and the three LINPACK ones from libR would mismatch at dyn.load.
          # No call site uses a return value, so declare them void.
          earth_shim <- function(
              url = "https://cran.r-project.org/src/contrib/earth_5.3.6.tar.gz") {
            tb  <- tempfile(fileext = ".tar.gz"); download.file(url, tb, quiet = TRUE)
            dir <- tempfile(); dir.create(dir); untar(tb, exdir = dir)
            pkg <- list.dirs(dir, recursive = FALSE)[1]

            path  <- file.path(pkg, "src", "earth.c")
            lines <- readLines(path)
            pat   <- "^(extern _C_ )int( (dqrdc2|dtrsl|dqrsl|daxpy)_\\()"
            hit   <- grepl(pat, lines, perl = TRUE)
            # Fails loudly if upstream fixes or rewrites the declarations.
            if (sum(hit) != 4L)
              stop(sprintf("earth patch: expected 4 int-returning declarations, found %d", sum(hit)))
            lines[hit] <- sub(pat, "\\1void\\2", lines[hit], perl = TRUE)
            writeLines(lines, path)

            paste0("local::", pkg)
          }

          # splancs (needed by cassowaryr -> tourr): mse2d() and khat() share
          # /anu/ -- hcell, h(1000), aval(1000) double under the routines'
          # IMPLICIT DOUBLE PRECISION (A-H,O-Z), ncell integer.
          splancs_shim <- function(
              url = "https://cran.r-project.org/src/contrib/splancs_2.01-45.tar.gz") {
            common_block_shim("splancs", url, "twodimmse.f", "ANU", c(
              "      BLOCK DATA DSANU",
              "      IMPLICIT DOUBLE PRECISION (A-H,O-Z)",
              "      COMMON /anu/ hcell,h(1000),aval(1000),ncell",
              "      DATA hcell, ncell /0.0D0, 0/",
              "      END"
            ))
          }

          # deSolve: the ODEPACK / VODE / ZVODE solver state blocks plus RADAU5's
          # two. Layouts: the doubles-then-integers compact forms ODEPACK
          # documents (DLS001 = RLS(218), ILS(37); DLSA01 = 22, 9; DLSR01 = 5, 9;
          # DLSS01 = 6, 34; DLPK01 = 4, 13; DVOD01 = 48, 33; DVOD02 = 1, 8),
          # ZVODE's as zvode.f itself declares them in ZVSRCO, and RADAU5's two
          # member-by-member under its IMPLICIT DOUBLE PRECISION (A-H,O-Z).
          deSolve_shim <- function(
              url = "https://cran.r-project.org/src/contrib/deSolve_1.42.tar.gz") {
            common_block_shim("deSolve", url, "opkda1.f",
              c("DLS001", "DLSA01", "DLSR01", "DLSS01", "DLPK01",
                "DVOD01", "DVOD02", "ZVOD01", "ZVOD02", "CONRA5", "LINAL"), c(
              "      BLOCK DATA DSBD001",
              "      DOUBLE PRECISION RLS(218)",
              "      INTEGER ILS(37)",
              "      COMMON /DLS001/ RLS, ILS",
              "      DATA RLS /218*0.0D0/",
              "      END",
              "      BLOCK DATA DSBDA01",
              "      DOUBLE PRECISION RLSA(22)",
              "      INTEGER ILSA(9)",
              "      COMMON /DLSA01/ RLSA, ILSA",
              "      DATA RLSA /22*0.0D0/",
              "      END",
              "      BLOCK DATA DSBDR01",
              "      DOUBLE PRECISION RLSR(5)",
              "      INTEGER ILSR(9)",
              "      COMMON /DLSR01/ RLSR, ILSR",
              "      DATA RLSR /5*0.0D0/",
              "      END",
              "      BLOCK DATA DSBDS01",
              "      DOUBLE PRECISION RLSS(6)",
              "      INTEGER ILSS(34)",
              "      COMMON /DLSS01/ RLSS, ILSS",
              "      DATA RLSS /6*0.0D0/",
              "      END",
              "      BLOCK DATA DSBDPK1",
              "      DOUBLE PRECISION RLPK(4)",
              "      INTEGER ILPK(13)",
              "      COMMON /DLPK01/ RLPK, ILPK",
              "      DATA RLPK /4*0.0D0/",
              "      END",
              "      BLOCK DATA DSBDV01",
              "      DOUBLE PRECISION RVOD1(48)",
              "      INTEGER IVOD1(33)",
              "      COMMON /DVOD01/ RVOD1, IVOD1",
              "      DATA RVOD1 /48*0.0D0/",
              "      END",
              "      BLOCK DATA DSBDV02",
              "      DOUBLE PRECISION RVOD2(1)",
              "      INTEGER IVOD2(8)",
              "      COMMON /DVOD02/ RVOD2, IVOD2",
              "      DATA RVOD2 /0.0D0/",
              "      END",
              "      BLOCK DATA DSBDZ01",
              "      DOUBLE PRECISION RVOD1(50)",
              "      INTEGER IVOD1(33)",
              "      COMMON /ZVOD01/ RVOD1, IVOD1",
              "      DATA RVOD1 /50*0.0D0/",
              "      END",
              "      BLOCK DATA DSBDZ02",
              "      DOUBLE PRECISION RVOD2(1)",
              "      INTEGER IVOD2(8)",
              "      COMMON /ZVOD02/ RVOD2, IVOD2",
              "      DATA RVOD2 /0.0D0/",
              "      END",
              "      BLOCK DATA DSBDCR5",
              "      INTEGER NN,NN2,NN3,NN4",
              "      DOUBLE PRECISION XSOL,HSOL,C2M1,C1M1",
              "      COMMON /CONRA5/NN,NN2,NN3,NN4,XSOL,HSOL,C2M1,C1M1",
              "      DATA NN,NN2,NN3,NN4 /0,0,0,0/",
              "      END",
              "      BLOCK DATA DSBDLIN",
              "      INTEGER MLE,MUE,MBJAC,MBB,MDIAG,MDIFF,MBDIAG",
              "      COMMON /LINAL/MLE,MUE,MBJAC,MBB,MDIAG,MDIFF,MBDIAG",
              "      DATA MLE /0/",
              "      END"
            ))
          }

          # brunnermunzel implements its Brunner-Munzel test (including the
          # permutation variant) in Fortran. webR's LLVM flang-rt aborts on the
          # package's runtime array constructors -- e.g. `xy = (/x, y/)` -- with
          # RUNTIME_CHECK(to.rank() == 1) in array-constructor.cpp, so even the
          # asymptotic test (perm = FALSE) crashes. Rewrite every runtime array
          # constructor, the vector-subscript scatter in rank(), and the
          # whole-array assignments into equivalent explicit DO loops
          # (numerically identical). Compile-time `parameter` constructors and
          # contiguous section arguments are left untouched.
          brunnermunzel_shim <- function(
              url = "https://cran.r-project.org/src/contrib/brunnermunzel_2.0.tar.gz") {
            tb  <- tempfile(fileext = ".tar.gz"); download.file(url, tb, quiet = TRUE)
            dir <- tempfile(); dir.create(dir); untar(tb, exdir = dir)
            pkg <- list.dirs(dir, recursive = FALSE)[1]

            E <- function(pattern, ...) list(pattern = pattern, repl = c(...))

            # Replace each line matching a Perl regex (anchored on the statement,
            # tolerant of indentation and trailing comments) with replacement
            # lines. Errors loudly if a pattern is gone, so an upstream source
            # change can't silently reintroduce an array constructor.
            patch <- function(file, edits) {
              path  <- file.path(pkg, "src", file)
              lines <- readLines(path)
              for (e in edits) {
                idx <- grep(e$pattern, lines, perl = TRUE)
                if (length(idx) == 0L)
                  stop(sprintf("brunnermunzel patch: %s: missing pattern: %s",
                               file, e$pattern))
                for (i in rev(idx)) {
                  before <- if (i > 1L) lines[seq_len(i - 1L)] else character(0)
                  after  <- if (i < length(lines)) lines[(i + 1L):length(lines)] else character(0)
                  lines  <- c(before, e$repl, after)
                }
              }
              writeLines(lines, path)
            }

            patch("rank.f", list(
              E("^\\s*integer i,j\\s*$",
                "      integer i,j,k"),
              E("^\\s*rk\\(idx\\(i:j\\)\\)\\s*=",
                "         do k = i, j",
                "            rk(idx(k)) = (i + j) * 0.5",
                "         enddo")
            ))

            patch("bm_test.f", list(
              E("^\\s*double precision se\\s*$",
                "      double precision se",
                "      integer i"),
              E("^\\s*xy\\s*=\\s*\\(/x, y/\\)",
                "      do i = 1, nx",
                "         xy(i) = x(i)",
                "      enddo",
                "      do i = 1, ny",
                "         xy(nx+i) = y(i)",
                "      enddo"),
              E("^\\s*ci\\(1:2\\)\\s*=\\s*pst",
                "         ci(1) = pst",
                "         ci(2) = pst"),
              E("^\\s*dx\\s*=\\s*\\(rkxy\\(1:nx\\)",
                "      do i = 1, nx",
                "         dx(i) = (rkxy(i) - rkx(i) - mx + (nx + 1) * 0.5)**2",
                "      enddo"),
              E("^\\s*dy\\s*=\\s*\\(rkxy\\(nx\\+1:nx\\+ny\\)",
                "      do i = 1, ny",
                "         dy(i) = (rkxy(nx+i) - rky(i) - my + (ny + 1) * 0.5)**2",
                "      enddo"),
              E("^\\s*lowertail\\s*=\\s*\\(/",
                "      lowertail(1) = 0",
                "      lowertail(2) = 1",
                "      lowertail(3) = 0"),
              E("^\\s*multi\\s*=\\s*\\(/",
                "      multi(1) = 2.0",
                "      multi(2) = 1.0",
                "      multi(3) = 1.0"),
              E("^\\s*ci\\s*=\\s*pst\\s*\\+\\s*Rf_qt",
                "      ci(1) = pst - Rf_qt(alpha * 0.5, abs(df), 0) * se",
                "      ci(2) = pst + Rf_qt(alpha * 0.5, abs(df), 0) * se")
            ))

            patch("calc_statistics.f", list(
              E("^\\s*dx\\s*=\\s*\\(rkxy\\(1:nx\\)",
                "      do i = 1, nx",
                "         dx(i) = (rkxy(i) - rkx(i) - mx + const(1))**2",
                "      enddo"),
              E("^\\s*dy\\s*=\\s*\\(rkxy\\(nx\\+1:nx\\+ny\\)",
                "      do i = 1, ny",
                "         dy(i) = (rkxy(nx+i) - rky(i) - my + const(2))**2",
                "      enddo")
            ))

            patch("divide_groups.f", list(
              E("^\\s*integer i,ix,iy\\s*$",
                "      integer i,ix,iy,k"),
              E("^\\s*tmp\\(1:\\(nx\\+1\\)\\)\\s*=",
                "      do k = 1, nx",
                "         tmp(k) = idx(k)",
                "      enddo",
                "      tmp(nx+1) = -1"),
              E("^\\s*xy\\(1:nx\\)\\s*=\\s*x\\(1:nx\\)",
                "      do k = 1, nx",
                "         xy(k) = x(k)",
                "      enddo"),
              E("^\\s*xy\\(\\(nx\\+1\\):\\(nx\\+ny\\)\\)\\s*=",
                "      do k = 1, ny",
                "         xy(nx+k) = y(k)",
                "      enddo")
            ))

            patch("combination.f", list(
              E("^\\s*integer i,bef\\(1:r\\),numx,key\\(1:r\\)\\s*$",
                "      integer i,bef(1:r),numx,key(1:r),k"),
              E("^\\s*bef\\(1:r\\)\\s*=",
                "      do k = 1, r",
                "         bef(k) = arr(k) - ini(k)",
                "      enddo"),
              E("^\\s*arr\\(1:r\\)\\s*=\\s*0\\s*$",
                "      do k = 1, r",
                "         arr(k) = 0",
                "      enddo"),
              E("^\\s*key\\(1:r\\)\\s*=\\s*0",
                "      do k = 1, r",
                "         key(k) = 0",
                "      enddo"),
              E("^\\s*arr\\(1:r\\)\\s*=\\s*arr\\(1:r\\)",
                "      do k = 1, r",
                "         arr(k) = arr(k) + ini(k)",
                "      enddo")
            ))

            patch("bm_permutation_stat.f", list(
              E("^\\s*integer::nx,ny,i,j\\s*$",
                "      integer::nx,ny,i,j,k"),
              E("^\\s*idx\\(1:r\\)\\s*=\\s*ini\\(1:r\\)",
                "      do k = 1, r",
                "         idx(k) = ini(k)",
                "      enddo")
            ))

            patch("bm_permutation_test.f", list(
              E("^\\s*integer::i,count\\s*$",
                "      integer::i,count,k"),
              E("^\\s*dat2\\(1:n\\)\\s*=\\s*dat\\(1:n\\)",
                "      do k = 1, n",
                "         dat2(k) = dat(k)",
                "      enddo"),
              E("^\\s*statistics\\(1:n_nCr\\)\\s*=\\s*abs",
                "         do k = 1, n_nCr",
                "            statistics(k) = abs(statistics(k))",
                "         enddo"),
              E("^\\s*statistics\\(1:n_nCr\\)\\s*=\\s*-statistics",
                "         do k = 1, n_nCr",
                "            statistics(k) = -statistics(k)",
                "         enddo")
            ))

            paste0("local::", pkg)
          }

          # CSDP (bundled in Rcsdp, needed by psych::fa fm = "minrank") calls
          # BLAS/LAPACK the pre-FC_LEN_T way: no hidden character-length args.
          # Native ABIs tolerate the mismatch, but wasm-ld enforces exact
          # signatures against webR's flang-built libRblas/libRlapack and
          # refuses to link (dgemm_ 13 args vs 15, etc.) -- why the package is
          # absent from every wasm farm. Rename the five affected symbols
          # inside the Csdp sub-build and forward them through C shims that
          # append the hidden lengths via FCONE.
          Rcsdp_shim <- function(
              url = "https://cran.r-project.org/src/contrib/Rcsdp_0.1.57.6.tar.gz") {
            tb  <- tempfile(fileext = ".tar.gz"); download.file(url, tb, quiet = TRUE)
            dir <- tempfile(); dir.create(dir); untar(tb, exdir = dir)
            pkg <- list.dirs(dir, recursive = FALSE)[1]

            syms <- c("dgemm_", "dgemv_", "dpotrf_", "dpotrs_", "dtrtri_")

            # Errors loudly if an upstream update changes how Csdp spells a
            # call, so the rename can't silently stop matching.
            src <- unlist(lapply(
              list.files(file.path(pkg, "src", "Csdp", "lib"),
                         pattern = "\\.c$", full.names = TRUE), readLines))
            for (s in syms)
              if (!any(grepl(s, src, fixed = TRUE)))
                stop("Rcsdp patch: no reference to ", s, " in Csdp/lib sources")

            # Rename only in the sub-make CFLAGS: blaswrap.c below must keep
            # the real names, or its own F77_CALL forwards would rename
            # themselves into infinite recursion.
            mv <- file.path(pkg, "src", "Makevars.in")
            lines <- readLines(mv)
            hit <- grepl("-DNOSHORTS", lines, fixed = TRUE)
            if (sum(hit) != 1L)
              stop("Rcsdp patch: expected one -DNOSHORTS line in src/Makevars.in")
            renames <- paste0("-D", syms, "=csdp_", syms, collapse = " ")
            lines[hit] <- sub("-DNOSHORTS", paste("-DNOSHORTS", renames),
                              lines[hit], fixed = TRUE)
            writeLines(lines, mv)

            writeLines(c(
              "#define USE_FC_LEN_T",
              "#include <R_ext/BLAS.h>",
              "#include <R_ext/Lapack.h>",
              "#ifndef FCONE",
              "# define FCONE",
              "#endif",
              "",
              "void csdp_dgemm_(char *transa, char *transb, int *m, int *n, int *k,",
              "                 double *alpha, double *a, int *lda, double *b, int *ldb,",
              "                 double *beta, double *c, int *ldc)",
              "{",
              "    F77_CALL(dgemm)(transa, transb, m, n, k, alpha, a, lda,",
              "                    b, ldb, beta, c, ldc FCONE FCONE);",
              "}",
              "",
              "void csdp_dgemv_(char *trans, int *m, int *n, double *alpha, double *a,",
              "                 int *lda, double *x, int *incx, double *beta, double *y,",
              "                 int *incy)",
              "{",
              "    F77_CALL(dgemv)(trans, m, n, alpha, a, lda, x, incx, beta, y, incy FCONE);",
              "}",
              "",
              "void csdp_dpotrf_(char *uplo, int *n, double *a, int *lda, int *info)",
              "{",
              "    F77_CALL(dpotrf)(uplo, n, a, lda, info FCONE);",
              "}",
              "",
              "void csdp_dpotrs_(char *uplo, int *n, int *nrhs, double *a, int *lda,",
              "                  double *b, int *ldb, int *info)",
              "{",
              "    F77_CALL(dpotrs)(uplo, n, nrhs, a, lda, b, ldb, info FCONE);",
              "}",
              "",
              "void csdp_dtrtri_(char *uplo, char *diag, int *n, double *a, int *lda,",
              "                  int *info)",
              "{",
              "    F77_CALL(dtrtri)(uplo, diag, n, a, lda, info FCONE FCONE);",
              "}"
            ), file.path(pkg, "src", "blaswrap.c"))

            paste0("local::", pkg)
          }

          library(rwasm)
          repo <- "/github/workspace/repo"

          pkgs <- c(
            "quadprog",
            "qs2",
            rootSolve_shim(),
            brunnermunzel_shim(),
            "nanonext",
            muhaz_shim(),
            deSolve_shim(),
            mclust_shim(),
            Rcsdp_shim(),
            splancs_shim(),
            earth_shim(),
            "url::https://cran.r-project.org/src/contrib/Archive/biclust/biclust_2.0.3.1.tar.gz",
            "url::https://cran.r-project.org/src/contrib/Archive/rtf/rtf_0.4-14.1.tar.gz",
            # CHAID is R-Forge only (never on CRAN); pure R, Depends: partykit.
            "url::https://download.r-forge.r-project.org/src/contrib/CHAID_0.1-2.tar.gz"
          )

          # ---- What's already provided, and what's a hard dependency? ----------
          ver     <- paste(R.version$major, sub("\\..*", "", R.version$minor), sep = ".")
          contrib <- sprintf("https://repo.r-wasm.org/bin/emscripten/contrib/%s", ver)
          upstream <- tryCatch(
            rownames(available.packages(contriburl = contrib)),
            error = function(e) {
              message("Could not read official webR index: ", conditionMessage(e)); character(0)
            }
          )
          # base + recommended ship inside webR, so they never need building.
          bundled <- rownames(installed.packages(priority = c("base", "recommended")))
          # CRAN source metadata, used to resolve dependency closures.
          cran <- available.packages(repos = "https://cloud.r-project.org")
          hard <- c("Depends", "Imports", "LinkingTo")

          is_url     <- function(ref) startsWith(ref, "url::")
          is_local   <- function(ref) startsWith(ref, "local::")
          is_special <- function(ref) is_url(ref) || is_local(ref)   # always build; not a CRAN name

          pkg_name <- function(ref) {
            if (is_local(ref)) {
              basename(sub("^local::", "", ref))
            } else if (is_url(ref)) {
              sub("^.*/([A-Za-z0-9.]+)_[0-9].*$", "\\1", ref)
            } else {
              ref
            }
          }

          # Hard deps (Depends/Imports/LinkingTo) from a parsed DESCRIPTION matrix.
          desc_hard_deps <- function(dcf) {
            flds <- intersect(colnames(dcf), hard)
            if (!length(flds)) return(character(0))
            nm <- trimws(gsub("\\(.*?\\)", "",
                              strsplit(paste(dcf[1, flds], collapse = ","), "[,\n]")[[1]]))
            setdiff(nm[nzchar(nm)], "R")
          }

          # DESCRIPTION for a url:: ref (download tarball) or local:: ref (read from disk).
          ref_dcf <- function(ref) {
            if (is_local(ref)) {
              read.dcf(file.path(sub("^local::", "", ref), "DESCRIPTION"))
            } else {
              tmp <- tempfile(fileext = ".tar.gz")
              download.file(sub("^url::", "", ref), tmp, quiet = TRUE)
              inside <- untar(tmp, list = TRUE)
              dpath  <- grep("(^|/)DESCRIPTION$", inside, value = TRUE)[1]
              untar(tmp, files = dpath, exdir = dirname(tmp))
              read.dcf(file.path(dirname(tmp), dpath))
            }
          }

          # ---- Recursive hard-dependency closure of everything requested -------
          req_names <- vapply(pkgs, pkg_name, character(1))
          seed <- unlist(lapply(pkgs, function(p) {
            if (is_special(p)) desc_hard_deps(ref_dcf(p)) else p
          }), use.names = FALSE)
          seed <- unique(seed[seed %in% rownames(cran)])
          closure <- unique(c(seed, unlist(
            tools::package_dependencies(seed, db = cran, which = hard, recursive = TRUE),
            use.names = FALSE)))

          missing_deps <- setdiff(closure, c(upstream, bundled, req_names))
          if (length(missing_deps))
            cat(sprintf("Hard deps missing upstream, building too: %s\n",
                        paste(missing_deps, collapse = ", ")))

          build_set <- c(pkgs, missing_deps)

          ok <- skipped <- failed <- character(0)
          for (p in build_set) {
            name <- pkg_name(p)
            if (!is_special(p) && name %in% upstream) {
              cat(sprintf("\n===== %s available upstream - skipping =====\n", name))
              skipped <- c(skipped, name); next
            }
            cat(sprintf("\n========== Building %s ==========\n", name))
            success <- tryCatch({
              add_pkg(p, repo_dir = repo, dependencies = FALSE)
              TRUE
            }, error = function(e) {
              cat(sprintf("!! BUILD FAILED for %s: %s\n", name, conditionMessage(e)))
              FALSE
            })
            if (isTRUE(success)) ok <- c(ok, name) else failed <- c(failed, name)
          }

          # ---- Keep the live binary of every package that failed ------------
          # Each deploy replaces the whole site, so a package that failed here
          # would vanish from the repo. Carry its currently served binary over
          # instead: only what built is replaced. A package the live repo has
          # never served stays missing.
          live_repo <- Sys.getenv("LIVE_REPO")
          bin_rel   <- file.path("bin", "emscripten", "contrib", ver)
          bin_dir   <- file.path(repo, bin_rel)
          kept <- lost <- character(0)
          if (length(failed)) {
            dir.create(bin_dir, recursive = TRUE, showWarnings = FALSE)
            live <- tryCatch(
              available.packages(contriburl = paste(live_repo, bin_rel, sep = "/"),
                                 filters = list()),
              error = function(e) {
                message("Could not read the live index: ", conditionMessage(e)); NULL
              }
            )
            for (name in failed) {
              if (is.null(live) || !name %in% rownames(live)) { lost <- c(lost, name); next }
              file <- sprintf("%s_%s.tgz", name, live[name, "Version"])
              got <- tryCatch({
                download.file(paste(live_repo, bin_rel, file, sep = "/"),
                              file.path(bin_dir, file), mode = "wb", quiet = TRUE)
                TRUE
              }, error = function(e) FALSE)
              if (got) kept <- c(kept, name) else lost <- c(lost, name)
            }
          }

          # add_pkg() wrote PACKAGES for what built; rewrite it to take in the
          # carried-over binaries too.
          write_packages(repo)

          built <- list.files(file.path(repo, "bin"), recursive = TRUE, pattern = "\\.tgz$")
          cat("\n================ SUMMARY ================\n")
          cat(sprintf("Built (%d): %s\n", length(ok), paste(ok, collapse = ", ")))
          cat(sprintf("Skipped, available upstream (%d): %s\n",
                      length(skipped), paste(skipped, collapse = ", ")))
          cat(sprintf("Total .tgz in repo: %d\n", length(built)))
          if (length(failed)) {
            cat("\n!!!!!!!!!!!!! FAILED PACKAGES !!!!!!!!!!!!!\n")
            cat(sprintf("Failed (%d):\n", length(failed)))
            cat(paste0("  - ", failed, collapse = "\n"), "\n")
            cat(sprintf("Kept the live binary (%d): %s\n", length(kept), paste(kept, collapse = ", ")))
            cat(sprintf("Missing from the repo - not served live, or its download failed (%d): %s\n",
                        length(lost), paste(lost, collapse = ", ")))
          }
          if (length(built) == 0) stop("No packages built - nothing to deploy.")

      - uses: actions/upload-pages-artifact@v3
        with:
          path: /github/workspace/repo

  deploy:
    needs: build
    permissions: { pages: write, id-token: write }
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
